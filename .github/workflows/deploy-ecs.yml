name: Build and Deploy Signa to ECS (Production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ecs-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: esignin
      ECS_CLUSTER: esignin
      ECS_SERVICES: e-signin-service
      IMAGE_TAG: prod
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL || 'https://esignin.sunculture.io/api/health' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [dns]
              nameservers = ["1.1.1.1", "8.8.8.8"]

      - name: Build and push Signa image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=
            NEXT_PUBLIC_SIGNING_BASE_URL=${{ vars.NEXT_PUBLIC_SIGNING_BASE_URL || 'https://esignin.sunculture.io' }}
            NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID }}
            NEXT_PUBLIC_GOOGLE_PICKER_API_KEY=${{ vars.NEXT_PUBLIC_GOOGLE_PICKER_API_KEY }}
            NEXT_PUBLIC_GOOGLE_PICKER_APP_ID=${{ vars.NEXT_PUBLIC_GOOGLE_PICKER_APP_ID }}
            APP_VERSION=0.1.0
            APP_COMMIT_SHA=${{ github.sha }}
            APP_BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: false

      - name: Record image URI
        run: |
          echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Force ECS deployment
        run: |
          for service in ${ECS_SERVICES}; do
            aws ecs update-service \
              --cluster "${ECS_CLUSTER}" \
              --service "${service}" \
              --force-new-deployment
          done

      - name: Wait for ECS services to stabilize
        run: |
          for service in ${ECS_SERVICES}; do
            aws ecs wait services-stable \
              --cluster "${ECS_CLUSTER}" \
              --services "${service}"
          done

      - name: Verify public health endpoint
        run: curl --fail --silent --show-error --retry 10 --retry-delay 10 "${HEALTHCHECK_URL}"
