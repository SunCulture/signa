name: Build and Deploy esignin to ECS

on:
  push:
    branches:
      - deploy-branch
  workflow_dispatch:

concurrency:
  group: ecs-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Use a GitHub-hosted runner so image builds do not consume EC2 disk space.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: esignin
      ECS_CLUSTER: esignin
      ECS_SERVICES: esignin-api-service esignin-service
      IMAGE_TAG: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [dns]
              nameservers = ["1.1.1.1", "8.8.8.8"]

      - name: Download Amazon RDS CA bundle
        run: |
          mkdir -p docker/certs
          curl --fail --silent --show-error --location \
            https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem \
            --output docker/certs/rds-global-bundle.pem
          test -s docker/certs/rds-global-bundle.pem
          grep -q "BEGIN CERTIFICATE" docker/certs/rds-global-bundle.pem

      - name: Build and push esignin image
        id: build-image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.esignin.sunculture.io
            NEXT_PUBLIC_SIGNING_BASE_URL=https://esignin.sunculture.io
            NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID }}
            NEXT_PUBLIC_GOOGLE_PICKER_API_KEY=${{ vars.NEXT_PUBLIC_GOOGLE_PICKER_API_KEY }}
            NEXT_PUBLIC_GOOGLE_PICKER_APP_ID=${{ vars.NEXT_PUBLIC_GOOGLE_PICKER_APP_ID }}
            APP_VERSION=0.1.0
            APP_COMMIT_SHA=${{ github.sha }}
            APP_BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: false

      - name: Output image URI
        run: echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Force ECS deployment
        run: |
          for service in ${ECS_SERVICES}; do
            aws ecs update-service \
              --cluster "${ECS_CLUSTER}" \
              --service "${service}" \
              --force-new-deployment
          done

      - name: Cleanup Docker
        if: always()
        run: docker system prune -af --filter "until=2h"
