services:
  signa:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
        NEXT_PUBLIC_SIGNING_BASE_URL: ${NEXT_PUBLIC_SIGNING_BASE_URL:-}
        NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID:-}
        NEXT_PUBLIC_GOOGLE_PICKER_API_KEY: ${NEXT_PUBLIC_GOOGLE_PICKER_API_KEY:-}
        NEXT_PUBLIC_GOOGLE_PICKER_APP_ID: ${NEXT_PUBLIC_GOOGLE_PICKER_APP_ID:-}
        APP_VERSION: ${APP_VERSION:-0.1.0}
        APP_COMMIT_SHA: ${APP_COMMIT_SHA:-}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-}
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      BACKEND_PORT: 3001
      FRONTEND_PORT: 3000
      HOSTNAME: 0.0.0.0
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-}
      APP_BUILD_TIME: ${APP_BUILD_TIME:-}
      DATABASE_TYPE: ${DATABASE_TYPE:-postgres}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_HOST: ${DATABASE_HOST:-}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USER: ${DATABASE_USER:-}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      DATABASE_NAME: ${DATABASE_NAME:-signa}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      DATABASE_MIGRATIONS_RUN: ${DATABASE_MIGRATIONS_RUN:-true}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-production-secret}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3001/api}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      STORAGE_SERVICE: ${STORAGE_SERVICE:-auto}
      STORAGE_PATH: /data/storage
      S3_ATTACHMENTS_BUCKET: ${S3_ATTACHMENTS_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      # Backward-compatible and advanced S3 options.
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_PREFIX: ${AWS_S3_PREFIX:-}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-false}
      AWS_S3_SERVER_SIDE_ENCRYPTION: ${AWS_S3_SERVER_SIDE_ENCRYPTION:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QUEUE_ENABLED: ${QUEUE_ENABLED:-true}
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://redis:6379}
      BULL_BOARD_ENABLED: ${BULL_BOARD_ENABLED:-false}
      BULL_BOARD_PASS: ${BULL_BOARD_PASS:-change-me-please}

      # Preferred DocuSeal-compatible SMTP contract. SMTP_ADDRESS enables mail.
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_DOMAIN: ${SMTP_DOMAIN:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      SMTP_ENABLE_STARTTLS: ${SMTP_ENABLE_STARTTLS:-}
      SMTP_ENABLE_SSL: ${SMTP_ENABLE_SSL:-}
      SMTP_ENABLE_TLS: ${SMTP_ENABLE_TLS:-}
      SMTP_SSL_VERIFY: ${SMTP_SSL_VERIFY:-}
      SMTP_OPEN_TIMEOUT: ${SMTP_OPEN_TIMEOUT:-}
      SMTP_READ_TIMEOUT: ${SMTP_READ_TIMEOUT:-}

      # Legacy Signa mail variables remain supported.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_AUTH_ENABLED: ${MAIL_AUTH_ENABLED:-false}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Signa}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@signa.com}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_TLS_REJECT_UNAUTHORIZED: ${MAIL_TLS_REJECT_UNAUTHORIZED:-true}
    ports:
      - "3000:3000"
    volumes:
      - signa-data:/data

volumes:
  signa-data:
